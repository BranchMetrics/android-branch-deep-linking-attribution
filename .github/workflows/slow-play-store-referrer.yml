name: slow-play-store-referrer
# Fails if a slow Play Store blocks the main thread (INTENG-23839).
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
permissions:
  contents: read
env:
  JAVA_DISTRIBUTION: "corretto"
  JAVA_VERSION: "17"
jobs:
  slow-play-store-referrer:
    name: slow-play-store-referrer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Setup java 17 for gradle
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - name: Build the test Play Store
        run: ./gradlew :Branch-SDK-TestPlayStore:assembleDebug
      # The default image has no Play Store to clash with; --force-queryable makes it visible.
      - name: Run the slow Play Store tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            adb install -r --force-queryable Branch-SDK-TestPlayStore/build/outputs/apk/debug/Branch-SDK-TestPlayStore-debug.apk
            ./gradlew :Branch-SDK:connectedDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx8192M -Dkotlin.daemon.jvm.options\\=\"-Xmx8192M\"" -Pandroid.testInstrumentationRunnerArguments.class=io.branch.referral.InstallReferrerSlowPlayStoreTests -Pandroid.testInstrumentationRunnerArguments.requireTestPlayStore=true
      - name: Save test artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: slow-play-store-referrer
          path: ./Branch-SDK/build/
