name: Layer 1 - SDK Wire Validation (PR Gate)

on:
  # The ticket's acceptance is that a push to the beta triggers this, and the badges in EMT-4079
  # read a branch status, which only a push event produces. A pull_request-only trigger leaves
  # both unmet.
  push:
    branches: ["6.0.0-beta.0"]
    paths:
      - "Branch-SDK/src/main/**"
      - "Branch-SDK-TestBed/**"
      - "Branch-SDK-GPTDriver/**"
      # scripts/** rather than naming each file: a named list goes stale silently the next time a
      # file moves or a new one is added under scripts/, the same trap the unit-test invocation
      # below had. Over-triggering on an unrelated scripts/ edit costs one CI run; under-triggering
      # costs a missed regression, which is the worse failure for a gate.
      - "scripts/**"
      - ".github/workflows/sdk-l1-validation.yml"
  pull_request:
    branches: [master, main, feature/mobileboost-e2e-tests, "6.0.0-beta.0"]
    # Duplicated rather than shared via a YAML anchor: GitHub Actions does not guarantee anchor
    # support, and a silently dead trigger is the worst failure mode for a gate.
    paths:
      - "Branch-SDK/src/main/**"
      - "Branch-SDK-TestBed/**"
      - "Branch-SDK-GPTDriver/**"
      # scripts/** rather than naming each file: a named list goes stale silently the next time a
      # file moves or a new one is added under scripts/, the same trap the unit-test invocation
      # below had. Over-triggering on an unrelated scripts/ edit costs one CI run; under-triggering
      # costs a missed regression, which is the worse failure for a gate.
      - "scripts/**"
      - ".github/workflows/sdk-l1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wire-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # Build both APKs up-front so the emulator step only deals with install/run/pull.
      # We deliberately bypass `connectedDebugAndroidTest` because, for `com.android.test`
      # modules using `ANDROIDX_TEST_ORCHESTRATOR` + `clearPackageData=true`, AGP's task
      # runner uninstalls the target package once the run finishes. The post-test
      # `adb shell run-as io.branch.branchandroidtestbed cat ...` then fails with
      # `unknown package` and no capture is produced for L1 validation.
      - name: Build TestBed + GPTDriver APKs
        env:
          # Gradle maps ORG_GRADLE_PROJECT_<name> env vars to project properties,
          # so the GPTDriver module's `findProperty("MOBILEBOOST_API_KEY")` picks
          # this up without ever placing the secret on the command line (where
          # it would appear in `ps`, kernel audit logs, and CI run UIs).
          ORG_GRADLE_PROJECT_MOBILEBOOST_API_KEY: ${{ secrets.MOBILEBOOST_API_KEY }}
        run: |
          ./gradlew \
            :Branch-SDK-TestBed:assembleDebug \
            :Branch-SDK-GPTDriver:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx8192M -Dkotlin.daemon.jvm.options\\=\"-Xmx8192M\""

      # Each scenario gets its own capture file, because CustomBranchApp appends
      # to the capture and nothing truncates it. Every scenario starts from wiped
      # app data; the cold_https generation run makes the install its link then
      # opens on. wire-link_generation.txt is cold_firstInstall's
      # generation capture, where /v1/url is.
      #
      # One line per command: the emulator-runner action splits `script:` on
      # newlines and runs each through its own `sh -c`, so a multi-line
      # construct here would not survive.
      - name: Run Instrumented Tests (Generate Activity) and Pull Logs
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILEBOOST_API_KEY: ${{ secrets.MOBILEBOOST_API_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # MOBILEBOOST_API_KEY is propagated to the script via the step `env:`
          # block above; the script reads it from the environment, so we no
          # longer pass the secret as a positional argument (avoids argv leak).
          script: |
            TEST_CLASS=io.branch.gptdriver.tests.N1OrganicOpenWireTest OUTPUT_LOG=wire-organic_open.txt CLEAR_LOG=1 WIPE_FIRST=1 ./scripts/run_l1_instrumented.sh
            COLD_SCENARIO=cold_firstInstall COLD_WIPE=1 LINK_LOG=wire-link_generation.txt CLEAR_LOG=1 WIPE_FIRST=1 ./scripts/run_l1_instrumented.sh
            COLD_SCENARIO=cold_https CLEAR_LOG=1 WIPE_FIRST=1 ./scripts/run_l1_instrumented.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Self-test the validator first. A regression in validate_l1_logs.py
      # itself (wrong required field, broken parser) would otherwise
      # surface as a false PASS or a confusing failure on the real
      # branchlogs.txt step. Discovers every test_*.py under scripts/ rather
      # than naming a module: a named list goes stale, silently, the next
      # time a file is split for size -- discover cannot.
      - name: Run L1 Validator Unit Tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      # Each capture is judged against its own scenario's contract.
      #
      # continue-on-error so the summary below still runs on a failure -- the
      # job is failed explicitly at the end.
      - name: Run L1 Validation Script
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          rc=0
          check () {
            echo "::group::$1"
            if ! python scripts/validate_l1_logs.py "$2" --scenario "$1" 2>&1 \
                 | sed "s/^FAILED:/FAILED: [$1]/" | tee -a /tmp/l1-output.txt; then
              rc=1
            fi
            echo "::endgroup::"
          }
          check organic_open wire-organic_open.txt
          check link_generation wire-link_generation.txt
          check cold_firstInstall wire-cold_firstInstall.txt
          check cold_https wire-cold_https.txt
          exit $rc

      # What the gate actually asserted, on the PR page rather than buried in
      # the job log.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Layer 1: SDK wire validation"
            echo
            grep -h -o 'posting to https://[^ ]*' wire-*.txt 2>/dev/null \
              | sed 's|.*api2.branch.io||' | sort | uniq -c > /tmp/l1-endpoints.txt || true
            if [ -s /tmp/l1-endpoints.txt ]; then
              echo "| endpoint | requests |"
              echo "| --- | ---: |"
              awk '{printf "| `%s` | %s |\n", $2, $1}' /tmp/l1-endpoints.txt
            else
              echo "No wire requests were captured."
            fi
            echo
            echo "Scenario coverage:"
            echo
            echo "| scenario group | status |"
            echo "| --- | --- |"
            if [ "${{ steps.validate.outcome }}" = "success" ]; then
              echo "| Cold | cold_firstInstall and cold_https pass |"
              echo "| Negative and guards | organic_open pass, no_stickiness, attribution_none and late_userActivity not implemented |"
            else
              echo "| Cold | see failures below |"
              echo "| Negative and guards | see failures below |"
            fi
            echo "| Warm | warm_https_onNewIntent and warm_uriScheme not implemented |"
            echo "| Hot | hot_https_foreground and hot_uriScheme not implemented |"
            echo
            if [ "${{ steps.validate.outcome }}" = "success" ]; then
              echo "Result: **PASS**"
            else
              echo "Result: **FAIL**"
              echo
              echo '```'
              grep '^FAILED:' /tmp/l1-output.txt || echo "(no FAILED lines; see the job log)"
              echo '```'
              echo
              echo "<details><summary>Captured wire log</summary>"
              echo
              echo '```'
              cat wire-*.txt > /tmp/l1-all.txt 2>/dev/null || true
              if [ -s /tmp/l1-all.txt ]; then head -c 40000 /tmp/l1-all.txt; echo; else echo "(no capture was produced)"; fi
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only upload from PRs originating in this repo. Forked PRs already
      # have GITHUB_TOKEN write restrictions, so the raw log never escapes
      # to fork artifacts.
      - name: Upload Logs on Failure
        if: always() && steps.validate.outcome != 'success' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: branch-wire-logs
          path: wire-*.txt

      - name: Fail the job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
