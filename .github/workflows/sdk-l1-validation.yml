name: Layer 1 - SDK Wire Validation (PR Gate)

on:
  # The ticket's acceptance is that a push to the beta triggers this, and the badges in EMT-4079
  # read a branch status, which only a push event produces. A pull_request-only trigger leaves
  # both unmet.
  push:
    branches: ["6.0.0-beta.0"]
    paths:
      - "Branch-SDK/src/main/**"
      - "Branch-SDK-TestBed/**"
      - "Branch-SDK-GPTDriver/**"
      - "scripts/validate_l1_logs.py"
      - "scripts/test_validate_l1_logs.py"
      - "scripts/run_l1_instrumented.sh"
      - ".github/workflows/sdk-l1-validation.yml"
  pull_request:
    branches: [master, main, feature/mobileboost-e2e-tests, "6.0.0-beta.0"]
    # Duplicated rather than shared via a YAML anchor: GitHub Actions does not guarantee anchor
    # support, and a silently dead trigger is the worst failure mode for a gate.
    paths:
      - "Branch-SDK/src/main/**"
      - "Branch-SDK-TestBed/**"
      - "Branch-SDK-GPTDriver/**"
      - "scripts/validate_l1_logs.py"
      - "scripts/test_validate_l1_logs.py"
      - "scripts/run_l1_instrumented.sh"
      - ".github/workflows/sdk-l1-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-wire-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      # Build both APKs up-front so the emulator step only deals with install/run/pull.
      # We deliberately bypass `connectedDebugAndroidTest` because, for `com.android.test`
      # modules using `ANDROIDX_TEST_ORCHESTRATOR` + `clearPackageData=true`, AGP's task
      # runner uninstalls the target package once the run finishes. The post-test
      # `adb shell run-as io.branch.branchandroidtestbed cat ...` then fails with
      # `unknown package` and `branchlogs.txt` is never produced for L1 validation.
      - name: Build TestBed + GPTDriver APKs
        env:
          # Gradle maps ORG_GRADLE_PROJECT_<name> env vars to project properties,
          # so the GPTDriver module's `findProperty("MOBILEBOOST_API_KEY")` picks
          # this up without ever placing the secret on the command line (where
          # it would appear in `ps`, kernel audit logs, and CI run UIs).
          ORG_GRADLE_PROJECT_MOBILEBOOST_API_KEY: ${{ secrets.MOBILEBOOST_API_KEY }}
        run: |
          ./gradlew \
            :Branch-SDK-TestBed:assembleDebug \
            :Branch-SDK-GPTDriver:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx8192M -Dkotlin.daemon.jvm.options\\=\"-Xmx8192M\""

      # TEMPORARY, revert before review. Drives the three scenario classes and
      # prints each capture's shape. The contracts in the next PR are written
      # from this output rather than from the plan text.
      - name: TEMP measure the three scenarios
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILEBOOST_API_KEY: ${{ secrets.MOBILEBOOST_API_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            TEST_CLASS=io.branch.gptdriver.tests.N1OrganicOpenWireTest OUTPUT_LOG=m-n1.txt CLEAR_LOG=1 ./scripts/run_l1_instrumented.sh
            TEST_CLASS=io.branch.gptdriver.tests.C3FirstInstallLinkWireTest OUTPUT_LOG=m-c3.txt CLEAR_LOG=1 ./scripts/run_l1_instrumented.sh
            TEST_CLASS=io.branch.gptdriver.tests.C1InstalledLinkWireTest OUTPUT_LOG=m-c1.txt CLEAR_LOG=1 ./scripts/run_l1_instrumented.sh
            python3 scripts/probe_shape.py m-n1.txt m-c3.txt m-c1.txt

      - name: Run Instrumented Tests (Generate Activity) and Pull Logs
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILEBOOST_API_KEY: ${{ secrets.MOBILEBOOST_API_KEY }}
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # MOBILEBOOST_API_KEY is propagated to the script via the step `env:`
          # block above; the script reads it from the environment, so we no
          # longer pass the secret as a positional argument (avoids argv leak).
          script: ./scripts/run_l1_instrumented.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      # Self-test the validator first. A regression in validate_l1_logs.py
      # itself (wrong required field, broken parser) would otherwise
      # surface as a false PASS or a confusing failure on the real
      # branchlogs.txt step. Unit tests run from the repo root so the
      # `scripts.test_validate_l1_logs` module path resolves cleanly.
      - name: Run L1 Validator Unit Tests
        run: python -m unittest scripts.test_validate_l1_logs -v

      # continue-on-error so the summary below still runs on a failure -- the
      # job is failed explicitly at the end.
      - name: Run L1 Validation Script
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/validate_l1_logs.py branchlogs.txt 2>&1 | tee /tmp/l1-output.txt

      # What the gate actually asserted, on the PR page rather than buried in
      # the job log.
      - name: Write run summary
        if: always()
        run: |
          {
            echo "### Layer 1 — SDK wire validation"
            echo
            grep -o 'posting to https://[^ ]*' branchlogs.txt 2>/dev/null \
              | sed 's|.*api2.branch.io||' | sort | uniq -c > /tmp/l1-endpoints.txt || true
            if [ -s /tmp/l1-endpoints.txt ]; then
              echo "| endpoint | requests |"
              echo "| --- | ---: |"
              awk '{printf "| `%s` | %s |\n", $2, $1}' /tmp/l1-endpoints.txt
            else
              echo "No wire requests were captured."
            fi
            echo
            echo "Scenario coverage:"
            echo
            echo "No scenario is authored yet, so the endpoint table above is the only assertion this gate makes."
            echo
            echo "| scenario group | status |"
            echo "| --- | --- |"
            echo "| Cold (C1–C3) | not implemented |"
            echo "| Warm (W1–W2) | not implemented |"
            echo "| Hot (H1–H2) | not implemented |"
            echo "| Negative / guards (N1–N4) | not implemented |"
            echo
            if [ "${{ steps.validate.outcome }}" = "success" ]; then
              echo "Result: **PASS**"
            else
              echo "Result: **FAIL**"
              echo
              echo '```'
              grep '^FAILED:' /tmp/l1-output.txt || echo "(no FAILED lines; see the job log)"
              echo '```'
              echo
              echo "<details><summary>Captured wire log</summary>"
              echo
              echo '```'
              if [ -s branchlogs.txt ]; then head -c 40000 branchlogs.txt; echo; else echo "(branchlogs.txt is empty or missing)"; fi
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Only upload from PRs originating in this repo. Forked PRs already
      # have GITHUB_TOKEN write restrictions, so the raw log never escapes
      # to fork artifacts.
      - name: Upload Logs on Failure
        if: always() && steps.validate.outcome != 'success' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: branch-wire-logs
          path: branchlogs.txt

      - name: Fail the job if validation failed
        if: steps.validate.outcome == 'failure'
        run: exit 1
